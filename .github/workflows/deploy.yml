name: CI - Build e deploy

# Valida padrao de commits, lint, formatacao e build em todo push e PR.
# Num push na main (merge de PR), publica no Worker portfolio-webdev (ADR 0005).

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  # Publica as contagens salvas no painel (ADR 0015): todo dia, ou no botao Run workflow
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  build:
    name: Build de validacao
    runs-on: ubuntu-latest

    steps:
      - name: Clonar o repositorio
        uses: actions/checkout@v4
        with:
          # Historico completo para o commitlint comparar a branch do PR com a main
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      # Os hooks do Husky podem ser pulados com --no-verify; aqui nao
      - name: Padrao dos commits do PR
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - name: Lint
        run: npm run lint

      - name: Formatacao
        run: npm run format:check

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Limite maior na API para gerar as paginas dos repositorios
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Conferir que o dist foi gerado
        run: test -f dist/index.html && echo "Build OK"

      - name: Conferir que _headers foi copiado
        run: test -f dist/_headers && echo "Headers OK"

      - name: Conferir as paginas geradas
        run: test -f dist/404.html && test -f dist/sitemap.xml && test -f dist/projetos/platao/index.html && echo "Paginas OK"

  deploy:
    name: Deploy na Cloudflare
    # So depois do build passar, e so na main: PR nunca publica
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Um deploy por vez; um merge novo espera o anterior terminar
    concurrency:
      group: deploy-producao
      cancel-in-progress: false
    environment:
      name: producao
      url: https://savioomiodev.com.br

    steps:
      - name: Clonar o repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Instala o wrangler na versao do package-lock, a mesma do deploy manual
      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Build e publicacao
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Valores publicos por natureza: quem protege os dados e o RLS do banco
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_FORMSPREE_ID: ${{ vars.VITE_FORMSPREE_ID }}
